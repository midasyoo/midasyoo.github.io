<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 · Yoon-Sik Yoo</title>
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<style>
  :root { --bg:#fbfcfd; --text:#1a2433; --muted:#5c6b7f; --accent:#2563c9; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0d1117; --text:#e4ebf3; --muted:#96a5b8; --accent:#6ea8fe; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    background: var(--bg); color: var(--text);
    font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont,
                 "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
    text-align: center; padding: 24px; line-height: 1.7;
  }
  .code { font-size: clamp(56px, 14vw, 88px); font-weight: 750; letter-spacing: -.04em; margin: 0; }
  p { color: var(--muted); margin: 10px 0 26px; }
  a {
    display: inline-block; color: #fff; background: var(--accent);
    padding: 10px 20px; border-radius: 9px; text-decoration: none; font-weight: 600;
  }
  a:hover { filter: brightness(1.08); }
</style>
</head>
<body>
  <div>
    <p class="code">404</p>
    <p>이 주소에는 아무것도 없습니다.<br>There is nothing at this address.</p>
    <a href="/">홈으로 · Go home</a>
  </div>
</body>
</html>
